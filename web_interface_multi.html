<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSS-TTS Multi-User Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .status-bar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.connected {
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .metrics {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }

        .metric {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .metric-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .metric-label {
            color: #999;
            margin-top: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .user-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .user-status {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .output {
            margin-top: 15px;
            padding: 12px;
            background: #f8f9ff;
            border-radius: 8px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .output.hidden {
            display: none;
        }

        .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 12px;
            color: #667eea;
            margin-bottom: 8px;
        }

        .status-text.success {
            color: #10b981;
        }

        .status-text.error {
            color: #ef4444;
        }

        audio {
            width: 100%;
            height: 30px;
            margin-top: 10px;
            border-radius: 6px;
        }

        .control-panel {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .control-panel h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-control {
            padding: 12px 20px;
            background: #f0f0f0;
            color: #333;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-control:hover {
            background: #e0e0e0;
        }

        .btn-control.primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-control.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-control.danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-control.danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎤 MOSS-TTS Multi-User Test</h1>
        <p>Real-time Voice Cloning - 4 Concurrent Users</p>
    </div>

    <div class="container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="connection-status">
                <div class="status-dot disconnected" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
            <div class="metrics">
                <div class="metric">
                    <div class="metric-value" id="activeUsers">0</div>
                    <div class="metric-label">Active Users</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="totalGenerated">0</div>
                    <div class="metric-label">Generated</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="avgLatency">0ms</div>
                    <div class="metric-label">Avg Latency</div>
                </div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <h2>Global Controls</h2>
            <div class="control-buttons">
                <button class="btn-control primary" onclick="generateAllAudio()">
                    🚀 Generate All at Once
                </button>
                <button class="btn-control" onclick="loadVoices()">
                    🔄 Refresh Voices
                </button>
                <button class="btn-control danger" onclick="clearAll()">
                    🗑️ Clear All
                </button>
            </div>
        </div>

        <!-- User Cards Grid -->
        <div class="grid" id="userGrid"></div>
    </div>

    <script>
        // Configuration
        const protocol = window.location.protocol;
        const hostname = window.location.hostname;
        const port = 8002;
        const BASE_URL = `${protocol}//${hostname}:${port}`;

        const NUM_USERS = 4;
        const DEFAULT_TEXTS = [
            "Hello! I'm the narrator of this wonderful story. Listen carefully as I tell you an amazing tale.",
            "Greetings, my friend! I love honey and adventures in the forest. Let me share a story with you.",
            "Hi everyone! I'm so excited to tell you about my day and all the fun things that happened.",
            "Bonjour! Let me speak to you in my unique voice. This is a wonderful test of the system."
        ];

        const VOICES_ORDER = ['narrator', 'bruno', 'mia', 'fox'];

        let users = [];
        let allVoices = [];
        let latencies = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeUsers();
            checkConnection();
            loadVoices();
            updateMetrics();
        });

        // Create user objects
        function initializeUsers() {
            users = Array.from({ length: NUM_USERS }, (_, i) => ({
                id: i + 1,
                sessionId: null,
                isGenerating: false,
                voice: VOICES_ORDER[i % VOICES_ORDER.length],
                text: DEFAULT_TEXTS[i],
                latency: 0
            }));

            renderUsers();
        }

        // Render user cards
        function renderUsers() {
            const grid = document.getElementById('userGrid');
            grid.innerHTML = users.map((user, idx) => `
                <div class="user-card">
                    <div class="user-header">
                        <div class="user-avatar" style="background: linear-gradient(135deg, ${getColorForUser(idx)} 0%, ${getColorForUser(idx + 2)} 100%)">
                            👤${user.id}
                        </div>
                        <div class="user-info">
                            <div class="user-name">User ${user.id}</div>
                            <div class="user-status" id="status-${user.id}">Ready</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Voice 🎭</label>
                        <select id="voice-${user.id}" onchange="updateUserVoice(${idx}, this.value)">
                            <option value="">Loading...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Text 📝</label>
                        <textarea id="text-${user.id}" placeholder="Enter text...">${user.text}</textarea>
                    </div>

                    <div class="button-group">
                        <button class="btn-generate" id="btn-${user.id}" onclick="generateAudio(${idx})">
                            Generate
                        </button>
                    </div>

                    <div class="output hidden" id="output-${user.id}">
                        <div class="spinner"></div>
                        <div class="status-text">Generating...</div>
                        <div id="audio-${user.id}"></div>
                    </div>
                </div>
            `).join('');

            // Populate voice selects
            updateVoiceSelects();
        }

        function getColorForUser(i) {
            const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b', '#fa709a'];
            return colors[i % colors.length];
        }

        function updateVoiceSelects() {
            users.forEach((user, idx) => {
                const select = document.getElementById(`voice-${user.id}`);
                select.innerHTML = allVoices
                    .map(v => `<option value="${v.id}" ${v.id === user.voice ? 'selected' : ''}>${v.name}</option>`)
                    .join('');
            });
        }

        function updateUserVoice(idx, voiceId) {
            users[idx].voice = voiceId;
        }

        // Check connection
        async function checkConnection() {
            try {
                const resp = await fetch(`${BASE_URL}/health`);
                if (resp.ok) {
                    updateConnectionStatus(true, '✓ Connected');
                    return true;
                }
            } catch (error) {
                updateConnectionStatus(false, '✗ Connection failed');
                return false;
            }
        }

        function updateConnectionStatus(connected, message) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const buttons = document.querySelectorAll('.btn-generate, .btn-control');

            if (connected) {
                dot.className = 'status-dot connected';
                text.textContent = message;
                buttons.forEach(btn => btn.disabled = false);
            } else {
                dot.className = 'status-dot';
                text.textContent = message;
                buttons.forEach(btn => btn.disabled = true);
            }
        }

        // Load voices
        async function loadVoices() {
            try {
                const resp = await fetch(`${BASE_URL}/voices`);
                const data = await resp.json();
                allVoices = data.voices;
                updateVoiceSelects();
            } catch (error) {
                alert('Failed to load voices');
            }
        }

        // Generate audio for one user
        async function generateAudio(userIdx) {
            const user = users[userIdx];
            const voice = document.getElementById(`voice-${user.id}`).value;
            const text = document.getElementById(`text-${user.id}`).value;
            const btn = document.getElementById(`btn-${user.id}`);
            const output = document.getElementById(`output-${user.id}`);
            const statusDiv = document.getElementById(`status-${user.id}`);
            const audioDiv = document.getElementById(`audio-${user.id}`);

            if (!voice) {
                alert('Please select a voice');
                return;
            }

            if (!text.trim()) {
                alert('Please enter text');
                return;
            }

            user.isGenerating = true;
            btn.disabled = true;
            output.classList.remove('hidden');
            statusDiv.textContent = 'Generating...';

            const startTime = Date.now();

            try {
                // Start session
                const startResp = await fetch(`${BASE_URL}/tts/session/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voice_id: voice, language: 'en' })
                });

                if (!startResp.ok) throw new Error('Failed to start');
                const session = await startResp.json();
                user.sessionId = session.session_id;

                // Push text
                await fetch(`${BASE_URL}/tts/session/${user.sessionId}/push`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                // Get audio
                const audioResp = await fetch(`${BASE_URL}/tts/session/${user.sessionId}/audio`);
                if (!audioResp.ok) throw new Error('Failed to stream');

                const blob = await audioResp.blob();
                const audioUrl = URL.createObjectURL(blob);
                const audio = document.createElement('audio');
                audio.controls = true;
                audio.src = audioUrl;
                audioDiv.innerHTML = '';
                audioDiv.appendChild(audio);

                // Close session
                await fetch(`${BASE_URL}/tts/session/${user.sessionId}/close`, {
                    method: 'POST'
                });

                const latency = Date.now() - startTime;
                user.latency = latency;
                latencies.push(latency);
                if (latencies.length > 20) latencies.shift();

                output.querySelector('.spinner').style.display = 'none';
                output.querySelector('.status-text').textContent = `✓ Generated in ${latency}ms`;
                output.querySelector('.status-text').className = 'status-text success';
                statusDiv.textContent = `Ready • ${latency}ms`;

            } catch (error) {
                output.querySelector('.spinner').style.display = 'none';
                output.querySelector('.status-text').textContent = `✗ Error: ${error.message}`;
                output.querySelector('.status-text').className = 'status-text error';
                statusDiv.textContent = 'Error';
            } finally {
                user.isGenerating = false;
                btn.disabled = false;
                updateMetrics();
            }
        }

        // Generate all at once
        async function generateAllAudio() {
            const generatePromises = users.map((_, idx) => generateAudio(idx));
            await Promise.all(generatePromises);
        }

        // Clear all
        function clearAll() {
            users.forEach((user, idx) => {
                const output = document.getElementById(`output-${user.id}`);
                const audioDiv = document.getElementById(`audio-${user.id}`);
                const statusDiv = document.getElementById(`status-${user.id}`);
                output.classList.add('hidden');
                audioDiv.innerHTML = '';
                statusDiv.textContent = 'Ready';
            });
            latencies = [];
            updateMetrics();
        }

        // Update metrics
        function updateMetrics() {
            const active = users.filter(u => u.isGenerating).length;
            const generated = users.filter(u => u.latency > 0).length;
            const avgLatency = latencies.length > 0
                ? Math.round(latencies.reduce((a, b) => a + b) / latencies.length)
                : 0;

            document.getElementById('activeUsers').textContent = active;
            document.getElementById('totalGenerated').textContent = generated;
            document.getElementById('avgLatency').textContent = avgLatency + 'ms';
        }
    </script>
</body>
</html>
